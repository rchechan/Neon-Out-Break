name: Build THE NINTH MINUTE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check story game JavaScript
        run: node --check app/src/main/assets/game.js
      - name: Validate chapter maps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/assets/game.js').read_text(encoding='utf-8')
          assert 'THE NINTH MINUTE' in src
          assert 'function finalChoice()' in src
          assert "endGame('third')" in src
          assert 'function lockHack()' in src
          assert 'function renderShop()' in src
          print('Narrative, hacking, secret ending and upgrades present')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk THE-NINTH-MINUTE.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-NINTH-MINUTE-APK
          path: THE-NINTH-MINUTE.apk
          retention-days: 30
          if-no-files-found: error
